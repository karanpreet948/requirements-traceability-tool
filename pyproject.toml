[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtm-tool"
version = "1.0.0"
description = "Requirements Traceability Matrix (RTM) builder: requirements -> user stories -> test cases, with coverage and gap analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Karanpreet Kaur" }]
dependencies = [
    "PyYAML>=6.0,<7.0",
    "openpyxl>=3.1,<4.0",
]

[tool.setuptools.packages.find]
include = ["rtm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
