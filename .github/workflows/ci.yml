name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: pytest -v

      - name: Build RTM from the committed sample data (smoke test)
        run: |
          python -m rtm build \
            --requirements data/requirements.yaml \
            --stories data/user_stories.yaml \
            --tests data/test_cases.yaml \
            --output out/rtm.xlsx

      - name: Upload generated workbook as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtm-workbook-py${{ matrix.python-version }}
          path: out/rtm.xlsx
